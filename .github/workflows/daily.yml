# Daily flight search.
#
#   plan    → works out how many parallel shards to run (one per enabled trip, capped)
#   search  → matrix of parallel jobs; each searches its share of the trips into its own SQLite file
#   report  → merges the shard DBs into the history DB on the `data` branch, builds the
#             report, sends notifications, and commits the DB + report back to `data`
#
# Secrets used (only those for the providers/notifiers enabled in config.yaml are needed):
#   SERPAPI_API_KEY, DUFFEL_ACCESS_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   SMTP_USERNAME, SMTP_PASSWORD, REPORT_EMAIL_TO
name: Daily flight search

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily; change to suit your time zone
  workflow_dispatch:
    inputs:
      provider:
        description: "Override providers (e.g. mock) — leave empty to use config.yaml"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-flight-search
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  MAX_SHARDS: "4"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - id: shards
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from flight_tracker.config import load_config
          cfg = load_config("config.yaml")
          n = max(1, min(int(os.environ["MAX_SHARDS"]), sum(t.enabled for t in cfg.trips)))
          print(f"shards={json.dumps(list(range(1, n + 1)))}")
          print(f"total={n}")
          PY
      - run: python -m flight_tracker plan ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }}

  search:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
        run: |
          python -m flight_tracker --db shards/shard-${{ matrix.shard }}.db search \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }} \
            ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shards/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check out history from the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add state origin/data
            git -C state checkout -B data
          else
            git worktree add --detach state
            git -C state checkout --orphan data
            git -C state rm -rf --quiet . || true
            printf '# Flight tracker data\n\nAutomated history DB and daily reports. Do not edit by hand.\n' > state/README.md
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Merge shard results into history
        run: python -m flight_tracker --db state/tracker.db merge shards/*.db

      - name: Build and send report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m flight_tracker --db state/tracker.db report --output-dir state/reports

      - name: Prune old offers (keeps each day's cheapest forever)
        run: python -m flight_tracker --db state/tracker.db prune --keep-days 120

      - name: Save history to the data branch
        if: always()
        run: |
          cd state
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: daily run $(date -u +%F)"
          for i in 1 2 3; do git push origin data && break; sleep $((i * 5)); done
