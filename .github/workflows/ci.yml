name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Smoke test (mock provider, no network)
        run: |
          python -m flight_tracker --config config.example.yaml plan
          python -m flight_tracker --config config.example.yaml --db /tmp/smoke.db run --provider mock --no-notify > /tmp/report.md
          grep -q "Daily flight report" /tmp/report.md
